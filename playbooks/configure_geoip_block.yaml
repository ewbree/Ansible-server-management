---
### Useful commands for troubleshooting:
### Listing all sets:       sudo ipset list -n
### Listing specific set:   sudo ipset list geoip
### Flushing set:           sudo ipset flush geoip
### Destroying set:         sudo ipset destroy geoip
### Check if IP is in set:  sudo ipset test geoip <IP>


- name: GeoIP filtering with ipset + iptables
  hosts: public
  become: true

  vars:
    traffic_logging: false  # Set to true if you also want to log traffic hitting the DROP rules.
    
    # Numeric value determines the position in the table where the number represents the new rule itself. The first rule starts from 1.
    # Change this to what fits your situation.
    # Set the number strategically that fits traffic volumes from countries best.
    # If most traffic comes from the listed countries, use a low(er) number and vice versa.
    rule_position: 4

    geoip_dir: /etc/iptables/geoip/
    geoip_aggregates: https://www.ipdeny.com/ipblocks/data/aggregated/
    
    # Country codes based on ISO-1366 standard. For refering other countries, check: https://en.wikipedia.org/wiki/List_of_ISO_3166_country_codes
    # Do also check: https://www.ipdeny.com/ipblocks/data/aggregated/
    # Or, for easier readability: https://www.ipdeny.com/ipblocks/
    # Be careful, adding many countries may or may not bog down the server due to firewall evaluations for each incoming new session.
    geoip_countries:
      ### Europe
      - ru  # Russia
      - by  # Belarus
      
      ### Asia/Middle-East
      - cn  # China
      - kp  # North Korea
      # - pk  # Pakistan
      # - sy  # Syria


  tasks:

    ### --- Install required tools --- 
    - name: Install ipset, iptables and curl
      ansible.builtin.apt:
        name:
          - ipset
          - iptables
          - curl
        state: present
        update_cache: true


    ### --- Download GeoIP aggregates and store them in dedicated directory ---    
    - name: Ensure GeoIP directory exists
      ansible.builtin.file:
        path: "{{ geoip_dir }}"
        state: directory
        mode: "0755"

    - name: Download GeoIP country lists
      ansible.builtin.get_url:
        url: "{{ geoip_aggregates }}{{ item }}-aggregated.zone"
        dest: "{{ geoip_dir }}/{{ item }}.zone"
        mode: "0644"
      loop: "{{ geoip_countries }}"
      register: geoip_downloads


    ### --- Create ipsets (line-by-line CIDR lists) objects for iptables to make use of ---
    - name: Create ipsets if it is missing
      ansible.builtin.command: "ipset create geoip-{{ item }} hash:net maxelem 65536"
      loop: "{{ geoip_countries }}"
      register: ipset_create
      failed_when: false
      changed_when: "'cannot be created' not in ipset_create.stderr"

    - name: Flush ipset content before reloading
      ansible.builtin.command: "ipset flush geoip-{{ item }}"
      loop: "{{ geoip_countries }}"
      changed_when: true

    - name: Load CIDRs into ipset
      ansible.builtin.shell: |
        while read cidr; do
          ipset add geoip-{{ item }} "$cidr" 2>/dev/null || true
        done < "{{ geoip_dir }}/{{ item }}.zone"
      loop: "{{ geoip_countries }}"
      changed_when: true




    ### --- Finally, configure iptables to make use of the ipsets by creating rules ---
    - name: Create iptables DROP rule
      ansible.builtin.iptables:
        chain: INPUT
        jump: DROP

        match_set: "geoip-{{ item }}"
        match_set_flags: "src"

        state: present
        action: insert
        rule_num: "{{ rule_position }}"
      loop: "{{ geoip_countries }}"

    - name: Create iptables LOG rule
      when: traffic_logging
      ansible.builtin.iptables:
        chain: INPUT
        jump: LOG
        limit: "5/min"
        log_prefix: "GeoIP BLOCK {{ item.code | upper }}: "

        match_set: "geoip-{{ item }}"
        match_set_flags: "src"

        state: present
        action: insert
        rule_num: "{{ rule_position }}"
      loop: "{{ geoip_countries }}"




    ### --- Gather orphaned country codes ---
    - name: Gather all present .zone files in geoip directory
      ansible.builtin.find:
        paths: "{{ geoip_dir }}"
        patterns: "*.zone"
      register: zone_files

    - name: Extract country codes from present .zone files
      ansible.builtin.set_fact:
        present_country_codes: "{{ zone_files.files | map(attribute='path') | map('basename') | map('regex_replace', '\\.zone$', '') | list }}"

    - name: Gather orphan country codes into list
      ansible.builtin.set_fact:
        orphan_country_codes: "{{ present_country_codes | difference(geoip_countries) }}"


    ### --- Remove iptables rules based on orphaned country codes ---
    - name: Remove orphaned DROP rules
      ansible.builtin.iptables:
        chain: INPUT
        jump: DROP

        match_set: "geoip-{{ item }}"
        match_set_flags: "src"

        state: absent
      loop: "{{ orphan_country_codes }}"

    - name: Remove orphaned LOG rules
      iptables:
        chain: INPUT
        jump: LOG
        limit: "5/min"
        log_prefix: "GeoIP BLOCK {{ item.code | upper }}: "

        match_set: "geoip-{{ item }}"
        match_set_flags: "src"

        state: absent
      loop: "{{ orphan_country_codes }}"


    ### --- Remove orphaned country codes ipsets and zones ---
    - name: Destroy orphan ipsets
      ansible.builtin.command: "ipset destroy geoip-{{ item }}"
      loop: "{{ orphan_country_codes }}"
      ignore_errors: true

    - name: Delete orphan .zone files
      file:
        path: "{{ geoip_dir }}/{{ item }}.zone"
        state: absent
      loop: "{{ orphan_country_codes }}"




    ### --- Make ipsets consistent after reboot ---
    - name: Save ipsets to .conf file
      ansible.builtin.shell: "ipset save > {{ geoip_dir }}ipset.conf"

    - name: Deploy ipset recovery binary
      ansible.builtin.template:
        src: "../files/ipset-restore.service.j2"
        dest: /etc/systemd/system/ipset-restore.service
        owner: root
        group: root
        mode: '0644'

    - name: Reload systemd daemon to pick up new binary
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Enable ipset recovery at boot
      ansible.builtin.systemd:
        name: ipset-restore.service
        enabled: true
