---
- name: Update Wings
  block:

  ### --- CHECK CURRENT ---
  - name: Check current Wings version
    command: wings version
    register: current_wings_version

  - name: Extract version number
    set_fact:
      current_wings_version: "{{ current_wings_version.stdout_lines[0] | regex_search('[0-9.]+') }}"


  ### --- FETCH LATEST ---
  - name: Fetch latest Wings release info
    uri:
      url: "{{ wings_release }}"
      return_content: yes
    register: new_wings_version

  - name: Extract latest Wings version number
    set_fact:
      new_wings_version: "{{ new_wings_version.json.tag_name | regex_replace('^v', '') }}"


  ### --- UPDATE WINGS ---
  - name: Determine if Wings update is needed
    set_fact:
      wings_update_needed: "{{ new_wings_version is version(current_wings_version, '>') }}"




  - name: Update Wings if newer version is available
    when: wings_update_needed
    block:
    ## Download Updated Binary
    - name: Stop Wings service
      systemd:
        name: "{{ wings_service }}"
        state: stopped

    - name: Download latest Wings binary
      ansible.builtin.get_url:
        url: "{{ wings_download_url }}"
        dest: "{{ wings_binary_path }}"
        mode: "0744"
        force: true

    - name: Ensure correct permissions on Wings binary
      ansible.builtin.file:
        path: "{{ wings_binary_path }}"
        mode: "0744"
        owner: root
        group: root


    ## Restart Process
    - name: Reload systemd daemon to pick up new binary
      systemd:
        daemon_reload: true

    - name: Start Wings service
      systemd:
        name: "{{ wings_service }}"
        state: started
        enabled: true
