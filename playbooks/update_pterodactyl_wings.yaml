---
###
### Based on the manual update instructions on Pterodactyl's documentation:
### https://pterodactyl.io/wings/1.0/upgrading.html
###

- name: Update Pterodactyl Wings
  hosts: all
  become: true

  vars:
    wings_arch: "{{ 'amd64' if ansible_facts.machine == 'x86_64' else 'arm64' }}"
    wings_download_url: "https://github.com/pterodactyl/wings/releases/latest/download/wings_linux_{{ wings_arch }}"

    wings_binary_path: /usr/local/bin/wings

    wings_service: wings


  tasks:

    ## Download Updated Binary
    - name: Stop Wings service
      systemd:
        name: "{{ wings_service }}"
        state: stopped

    - name: Download latest Wings binary
      get_url:
        url: "{{ wings_download_url }}"
        dest: "{{ wings_binary_path }}"
        mode: "0744"
        force: true

    - name: Ensure correct permissions on Wings binary
      file:
        path: "{{ wings_binary_path }}"
        mode: "0744"
        owner: root
        group: root

    ## Reload systemd daemon after new binary is in place
    - name: Reload systemd daemon to pick up new binary
      systemd:
        daemon_reload: true
        
    ## Restart Process
    - name: Start Wings service
      systemd:
        name: "{{ wings_service }}"
        state: started
        enabled: true

    ### Wait for Wings to be ready (systemd level)
    - name: Wait for Wings service to become active
      wait_for:
        timeout: 60
        state: started

    ### Verify Wings health endpoint is responding
    - name: Verify Wings health endpoint
      uri:
        url: "http://localhost:8080/health"
        method: GET
        status_code: [200, 403]
        return_content: true
      register: wings_health

    ### Fail if health check fails after retries (using loop with delay)
    - name: Retry Wings health check on failure
      block:
        - name: Wait and retry health check
          wait_for:
            port: 8080
            timeout: 30
      rescue:
        - name: Report Wings health check failure
          fail:
            msg: "Wings service failed to start properly. Health endpoint did not respond within the timeout period."
